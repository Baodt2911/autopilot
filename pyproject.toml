[project]
name = "autopilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
autopilot = "autopilot.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autopilot"]
